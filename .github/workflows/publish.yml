name: Publish

# Every push to main becomes a build on the Robust.Cdn, which then tells the watchdog; the server restarts
# onto it at the end of the current round. Manual runs are still possible from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# One publish at a time and never cancelled part-way: a killed run could leave a half-registered version.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # to resolve the build artifact's download URL for the CDN

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.2.2
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build packaging tool
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    # Only the platform the server actually runs on. Add e.g. `--platform linux-x64` if a Linux host ever joins.
    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    # The CDN pulls the build from here (Robust.Cdn "one-shot" publish), so the 360 MB client never has to be
    # uploaded through Cloudflare's 100 MB request limit. Stored uncompressed: the zips are already compressed.
    - name: Upload build artifact
      id: artifact
      uses: actions/upload-artifact@v4
      with:
        name: wolfgate-build-${{ github.run_number }}
        path: release/
        if-no-files-found: error
        compression-level: 0
        retention-days: 3

    - name: Publish to Robust.Cdn
      run: python3 Tools/publish_github_artifact.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        GITHUB_REPOSITORY: ${{ github.repository }}

    - name: Publish changelog (Discord)
      continue-on-error: true
      run: Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
